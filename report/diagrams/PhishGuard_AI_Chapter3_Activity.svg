<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1920" viewBox="0 0 1500 1920">
 <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315a7d"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".14"/></filter><style>.t{font-family:'Arial',sans-serif;font-size:36px;font-weight:700;fill:#17324d}.h{font-family:'Arial',sans-serif;font-size:18px;font-weight:700;fill:#17324d}.b{font-family:'Arial',sans-serif;font-size:15px;font-weight:400;fill:#476074}.q{font-family:'Arial',sans-serif;font-size:17px;font-weight:700;fill:#17324d}.lab{font-family:'Arial',sans-serif;font-size:14px;font-weight:700;fill:#315a7d}.ar{stroke:#315a7d;stroke-width:3.5;fill:none;marker-end:url(#a)}.box{fill:#fff;stroke:#5f88a6;stroke-width:3}.safe{fill:#e8f6f2;stroke:#45937c;stroke-width:3}.warn{fill:#fff4e5;stroke:#cb8932;stroke-width:3}.err{fill:#fde9e7;stroke:#c65e50;stroke-width:3}</style></defs>
 <rect width="1500" height="1920" fill="#f7fafc"/><text x="750" y="58" text-anchor="middle" class="t">HYBRID EMAIL AND SMS ANALYSIS ACTIVITY</text>
 <circle cx="750" cy="115" r="24" fill="#17324d"/><path d="M750 140V185" class="ar"/>
 <rect x="530" y="190" width="440" height="100" rx="20" class="box" filter="url(#s)"/><text x="750" y="231" text-anchor="middle" class="h">RECEIVE MODE AND MESSAGE FIELDS</text><text x="750" y="260" text-anchor="middle" class="b">Email: sender + subject + body • SMS: sender + body</text><path d="M750 292V340" class="ar"/>
 <polygon points="750,340 930,430 750,520 570,430" fill="#eaf1f6" stroke="#5f88a6" stroke-width="3"/><text x="750" y="423" text-anchor="middle" class="q">INPUT VALID?</text><text x="750" y="448" text-anchor="middle" class="b">Mode, sender, body and limits</text>
 <path d="M570 430H280V535" class="ar"/><text x="420" y="414" class="lab">NO</text><rect x="90" y="540" width="380" height="92" rx="20" class="err" filter="url(#s)"/><text x="280" y="578" text-anchor="middle" class="h">SHOW FIELD ERRORS</text><text x="280" y="606" text-anchor="middle" class="b">Do not invoke the analyzer</text>
 <path d="M750 520V575" class="ar"/><text x="766" y="555" class="lab">YES</text><rect x="530" y="580" width="440" height="88" rx="20" class="box" filter="url(#s)"/><text x="750" y="616" text-anchor="middle" class="h">NORMALISE CHANNEL TEXT</text><text x="750" y="644" text-anchor="middle" class="b">Clear subject for SMS; combine subject/body for email</text><path d="M750 670V720" class="ar"/>
 <polygon points="750,720 930,810 750,900 570,810" fill="#eaf1f6" stroke="#5f88a6" stroke-width="3"/><text x="750" y="800" text-anchor="middle" class="q">CHANNEL MODEL</text><text x="750" y="825" text-anchor="middle" class="q">AVAILABLE AND LOADABLE?</text>
 <path d="M930 810H1043" class="ar"/><text x="965" y="793" class="lab">NO</text><rect x="1050" y="764" width="370" height="92" rx="20" class="err" filter="url(#s)"/><text x="1235" y="802" text-anchor="middle" class="h">SHOW CONTROLLED ERROR</text><text x="1235" y="830" text-anchor="middle" class="b">No risk verdict is produced</text>
 <text x="767" y="930" class="lab">YES</text>
 <!-- parallel -->
 <rect x="150" y="965" width="520" height="230" rx="24" class="safe" filter="url(#s)"/><text x="410" y="1005" text-anchor="middle" class="h">STATISTICAL TEXT EVIDENCE</text><text x="410" y="1045" text-anchor="middle" class="b">1. Transform text with channel TF-IDF</text><text x="410" y="1075" text-anchor="middle" class="b">2. Predict class-aware phishing probability</text><text x="410" y="1105" text-anchor="middle" class="b">3. Retain predicted-class confidence separately</text><text x="410" y="1145" text-anchor="middle" class="b">Model contribution: 0–45 points above 0.55 floor</text>
 <rect x="830" y="965" width="520" height="230" rx="24" class="safe" filter="url(#s)"/><text x="1090" y="1005" text-anchor="middle" class="h">EXPLAINABLE RULE EVIDENCE</text><text x="1090" y="1045" text-anchor="middle" class="b">1. Content patterns + negation/awareness</text><text x="1090" y="1075" text-anchor="middle" class="b">2. Local sender/domain checks</text><text x="1090" y="1105" text-anchor="middle" class="b">3. Static URL checks without visiting links</text><text x="1090" y="1145" text-anchor="middle" class="b">Deduplicated evidence contribution: cap 60 points</text>
 <path d="M750 905V935H410V958" class="ar"/><path d="M750 935H1090V958" class="ar"/><path d="M410 1195V1250H750" stroke="#315a7d" stroke-width="3.5" fill="none"/><path d="M1090 1195V1250H750V1270" class="ar"/>
 <rect x="475" y="1275" width="550" height="110" rx="22" class="box" filter="url(#s)"/><text x="750" y="1318" text-anchor="middle" class="h">CALCULATE PRELIMINARY SCORE</text><text x="750" y="1347" text-anchor="middle" class="b">Model points + evidence points − permitted context credit</text><path d="M750 1387V1435" class="ar"/>
 <rect x="420" y="1440" width="660" height="145" rx="22" class="warn" filter="url(#s)"/><text x="750" y="1482" text-anchor="middle" class="h">APPLY EXPLANATORY SAFEGUARDS</text><text x="750" y="1515" text-anchor="middle" class="b">No evidence → cap 39 • Link/data-request evidence → floor 40</text><text x="750" y="1544" text-anchor="middle" class="b">Strong deception/combination → floor 70 • Clamp 0–100</text><path d="M750 1587V1635" class="ar"/>
 <rect x="205" y="1640" width="290" height="115" rx="22" fill="#e6f4ea" stroke="#4f9a68" stroke-width="3" filter="url(#s)"/><rect x="605" y="1640" width="290" height="115" rx="22" fill="#fff6d6" stroke="#d2a534" stroke-width="3" filter="url(#s)"/><rect x="1005" y="1640" width="290" height="115" rx="22" fill="#fde9e7" stroke="#c65e50" stroke-width="3" filter="url(#s)"/>
 <text x="350" y="1684" text-anchor="middle" class="h">LOW RISK</text><text x="350" y="1716" text-anchor="middle" class="b">0–39</text><text x="750" y="1684" text-anchor="middle" class="h">SUSPICIOUS</text><text x="750" y="1716" text-anchor="middle" class="b">40–69</text><text x="1150" y="1684" text-anchor="middle" class="h">HIGH RISK</text><text x="1150" y="1716" text-anchor="middle" class="b">70–100</text>
 <path d="M750 1635V1618H350V1633M750 1635V1633M750 1618H1150V1633" class="ar"/>
 <path d="M350 1757V1805H750M750 1757V1805M1150 1757V1805H750V1820" stroke="#315a7d" stroke-width="3.5" fill="none" marker-end="url(#a)"/>
 <rect x="390" y="1825" width="720" height="70" rx="22" fill="#243b53"/><text x="750" y="1854" text-anchor="middle" style="font-family:'Arial',sans-serif;font-size:17px;font-weight:700;fill:#fff">BUILD EXPLANATIONS • STORE SCAN • RENDER RESULT</text><text x="750" y="1880" text-anchor="middle" style="font-family:'Arial',sans-serif;font-size:14px;font-weight:400;fill:#dce6ee">Channel-appropriate verdict, safe signals and recommended actions</text>
</svg>